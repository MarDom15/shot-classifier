# Stack 100% locale et gratuite : l'app Streamlit (interface) + l'agent
# autonome (ré-entraînement périodique + monitoring), tous deux construits
# depuis la même image. Les deux services partagent les mêmes volumes afin
# que les modèles ré-entraînés par l'agent soient immédiatement visibles
# dans l'app, sans redémarrage.
services:
  app:
    build: .
    image: shot-classifier:latest
    container_name: shot-classifier-app
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
      - "8002:8000"  # /metrics Prometheus (predictions, latence) — 8000 souvent deja pris sur l'hote
    volumes:
      - ./data:/app/data
      - ./models_store:/app/models_store
      - ./models_store_history:/app/models_store_history
      - ./docs/reports:/app/docs/reports
      - ./monitoring:/app/monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  agent:
    build: .
    image: shot-classifier:latest
    container_name: shot-classifier-agent
    command: ["python", "-m", "src.agent.ml_agent", "watch", "--interval", "${AGENT_INTERVAL_SECONDS:-21600}"]
    ports:
      - "8001:8001"  # /metrics Prometheus (cycles, F1, rollbacks)
    volumes:
      - ./data:/app/data
      - ./models_store:/app/models_store
      - ./models_store_history:/app/models_store_history
      - ./docs/reports:/app/docs/reports
      - ./monitoring:/app/monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: shot-classifier-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: shot-classifier-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
